# Full stack: infra (Postgres, Redis, Temporal) + app (api, worker, payer, web).
# Run:  docker compose -f docker-compose.full.yml up --build
# For a no-Temporal, no-Postgres demo instead, use `make demo-api` + `make web`.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clearance
      POSTGRES_PASSWORD: clearance
      POSTGRES_DB: clearance
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=clearance
      - POSTGRES_PWD=clearance
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on: [temporal]
    ports: ["8088:8080"]

  payer:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: uvicorn payer_service.app:app --host 0.0.0.0 --port 8081
    ports: ["8081:8081"]

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: uvicorn clearance.api.main:app --host 0.0.0.0 --port 8080
    environment:
      - DATABASE_URL=postgresql+psycopg://clearance:clearance@postgres:5432/clearance
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_HOST=temporal:7233
      - PAYER_BASE_URL=http://payer:8081
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8080:8080"]

  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: python -m clearance.workflows.worker
    environment:
      - DATABASE_URL=postgresql+psycopg://clearance:clearance@postgres:5432/clearance
      - TEMPORAL_HOST=temporal:7233
      - PAYER_BASE_URL=http://payer:8081
    depends_on:
      temporal: { condition: service_started }
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/Dockerfile.web }
    environment:
      - API_BASE_URL=http://api:8080
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
